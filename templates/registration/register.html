{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | TechNova</title>

    <link rel="stylesheet" href="{% static 'store/style1.css' %}">
</head>
<body>

<section class="section auth-card">

    <a href="{% url 'store:home' %}" class="logo">
        TechNova<span>.</span>
    </a>

    <h1>Create an account</h1>

    <form method="POST" class="filter-form">
        {% csrf_token %}

        {{ form.as_p }}

        <button type="submit" class="primary-button">
            Register
        </button>
    </form>

    <p>
        Already have an account?
        <a href="{% url 'store:login' %}">Log in</a>
    </p>

</section>

</body>
</html>
